(h,n)=>{let m=P([50,60,70,80]),a=P([1,2,3]);return h?mk("EL",`A ${m} kg person stands on a scale in an elevator accelerating DOWNWARD at ${a} m/s². What does the scale read? (g = 10 m/s²)`,nums(m*(g-a),[m*(g+a),m*g,m*a]," N"),n,`N = m(g − a) = ${m}×${g-a} = ${m*(g-a)} N.`):mk("EL",`A ${m} kg person stands on a scale in an elevator accelerating UPWARD at ${a} m/s². What does the scale read? (g = 10 m/s²)`,nums(m*(g+a),[m*(g-a),m*g,m*a]," N"),n,`N − mg = ma, so N = m(g + a) = ${m*(g+a)} N.`)},

["EL","A person stands on a scale in an elevator moving upward at constant speed. The scale reads","exactly the person’s weight, mg",["more than mg","less than mg","zero","mg plus the elevator’s weight","depends on the speed"],"Constant velocity means a = 0, so N = mg."],
["PU","In a frictionless Atwood machine with unequal masses, the string tension is","between the weights of the two masses",["equal to the heavier weight","equal to the lighter weight","equal to the sum of weights","zero","greater than both weights"],"The heavy mass accelerates down so T < m₂g; the light mass accelerates up so T > m₁g."],

const F1=h=>{let m=P([2,4,5]),mu=P([.2,.3,.4]),f=rd(mu*m*g),F=rd(f+m*R(1,3)),a=rd((F-f)/m),v=P([4,6,8]);
 let ps=[pt("What is the normal force on the block?",nums(m*g,[m,F,m*g*mu]," N"),1,"FBD","Vertical forces balance: N = mg."),
 pt("What is the friction force on the block?",nums(f,[mu*m,F,m*g]," N"),1,"FR",`f = μₖN = ${mu}×${m*g} = ${f} N.`),
 pt("What is the block’s acceleration?",nums(a,[F/m,(F+f)/m,F-f]," m/s²"),2,"N2",`a = (F − f)/m = ${rd(F-f)}/${m} = ${a} m/s².`),
 pt("The pulling force is doubled. How does the friction force change?",{c:"It stays the same, since N and μₖ are unchanged",w:["It doubles with the pull","It is cut in half","It becomes zero","It increases because the speed increases"]},2,"FR","Kinetic friction = μₖN depends on N, not on the applied force or speed."),
 pt("To measure μₖ experimentally, which graph gives a line whose slope is μₖ?",{c:"Friction force (vertical) vs. normal force (horizontal)",w:["Friction force vs. speed","Normal force vs. time","Applied force vs. time"]},2,"FR","Since f = μₖN, a plot of f vs. N is a line through the origin with slope μₖ.")];
 if(h)ps.push(pt(`The rope is cut when the block moves at ${v} m/s. How far does it slide before stopping?`,nums(v*v/(2*mu*g),[v/(mu*g),v*v/(mu*g),v*v/(2*g)]," m"),2,"FR",`a = μₖg = ${rd(mu*g)} m/s²; d = v²/(2a) = ${rd(v*v/(2*mu*g))} m.`));

const F2=h=>{let m1=P([2,3,4]),m2=P([1,2]),mu=P([.1,.2]),a=h?(m2*g-mu*m1*g)/(m1+m2):m2*g/(m1+m2),T=h?m1*a+mu*m1*g:m1*a;

 pt("What is the magnitude of the acceleration of the blocks?",nums(a,[g,m2*g/m1,(m2*g)/(m1*m2)]," m/s²"),2,"PU",`Whole system: a = (m₂g${h?" − μₖm₁g":""})/(m₁+m₂) = ${rd(a)} m/s².`),

 return (t.adv||[]).join("")+(t.fin||"")+t.o.map((o,j)=>{const g=t.done&&j===t.a,b=t.bad.includes(j);return`<button class="s ob${g?" good":""}${b?" bad":""}${b&&t.shk===j?" shake":""}${g&&t.pp===j?" pop":""}" ${t.done||b?"disabled":""} onclick="tt('${k}',${j})">${ab(j)}. ${o}</button>`}).join("")}
function tt(k,j){const t=TI[k];t.n++;t.adv=t.adv||[];t.shk=j;
 const ad=(h)=>`<div class="adv"><p class="no"><b>You chose ${ab(j)}. ${t.o[j]}</b> ${h}</p><p><b>What might have gone wrong with this choice:</b> ${WHY[t.s]}</p><p><b>How to fix it:</b> ${TIP[t.s]}</p></div>`;
 if(j===t.a){t.done=1;t.cr=t.n==1?1:.5;t.pp=j;t.fin=`<p class="ok"><b>Correct${t.n==2?" on the second try (half credit)":""}!</b> ${t.e}</p>`}
 else if(t.n==1){t.bad.push(j);t.adv.push(ad("is not quite right. You have one more try."))}
 else{t.bad.push(j);t.done=1;t.cr=0;t.pp=t.a;t.adv.push(ad("is not right either."));t.fin=`<p class="ok"><b>The correct answer is ${ab(t.a)}. ${t.o[t.a]}</b></p><p><b>Why it’s right:</b> ${t.e}</p>`}
 if(t.cr!==undefined)CR[k]=t.cr;
 if(k[0]==="L")render(1);else{$("tb_"+k).innerHTML=tbx(k);sv()}
 setTimeout(()=>{t.shk=-1;t.pp=-1},700)}

CG2.forEach(c=>pool.push({s:c[0],c:1,x:1,f:(h,n)=>mk(c[0],c[1],{c:c[2],w:sh(c[3])},n,c[4])}));
const F4=h=>{let m=P([2,4,5]),k=P([100,200,250,400]),d=P([.05,.1]),x=m*g/k,ps=[pt("What force does the spring exert when the mass hangs at rest?",nums(m*g,[m,k*x*2,k],' N'),1,"SP",`ΣF = 0, so F_spring = mg = ${m*g} N.`),pt("How far is the spring stretched at equilibrium?",nums(x,[m/k,k/(m*g),m*g*k],' m'),2,"SP",`kx = mg, so x = ${m*g}/${k} = ${rd(x)} m.`),pt("The spring is replaced by a stiffer one (larger k). The equilibrium stretch",{c:"decreases",w:["increases","stays the same","becomes zero"]},2,"SP","x = mg/k, so a larger k gives a smaller stretch.")];
 if(h)ps.push(pt(`The mass is pulled an extra ${d} m downward and released. What is its acceleration at that instant?`,nums(k*d/m,[k*(x+d)/m,k*d,g],' m/s²'),2,"SP",`The extra stretch d gives a net upward force kd, so a = kd/m = ${rd(k*d/m)} m/s².`));
 return{t:"Mathematical Routines: spring force",st:`A ${m} kg mass hangs at rest from a vertical spring with k = ${k} N/m. Use g = 10 m/s².`,ps}};
const F5=h=>{let a=P([2,3,4]),b=P([2,3]),W=P([50,60,70]),g2=g*a/(b*b),M=R(2,9)*1e24,mm=R(2,9)*1e22,r=R(2,9)*1e8,F=Gc*M*mm/(r*r),ps=[pt("What is the gravitational field strength at the planet’s surface?",nums(g2,[g*a/b,g*b*b/a,g*a*b],' m/s²'),2,"GC",`g ∝ M/R², so g = 10 × ${a}/${b}² = ${rd(g2)} m/s².`),pt(`What does a ${W} kg person weigh on the planet?`,nums(W*g2,[W*g,W,g2],' N'),1,"GR",`W = mg = ${W}×${rd(g2)} = ${rd(W*g2)} N.`),pt("How does the person’s mass on the planet compare with their mass on Earth?",{c:"It is the same",w:["It is larger","It is smaller","It scales with g"]},1,"GR","Mass does not depend on location.")];
 if(h)ps.push(pt(`The planet (${sci(M)} kg) and a moon (${sci(mm)} kg) are ${sci(r)} m apart. What is the gravitational force between them? (G = 6.67 × 10^−11 N·m²/kg²)`,{c:sci(F)+" N",w:[F*4,F/4,F*2,F/2,F*9].map(x=>sci(x)+" N")},2,"GC",`F = Gm₁m₂/r² = ${sci(F)} N.`));
 return{t:"Qualitative/Quantitative Translation: gravitation",st:`A planet has ${a} times Earth’s mass and ${b} times Earth’s radius. Earth’s surface gravity is 10 m/s².`,ps}};
const F6=h=>{let m=P([50,60,70,80]),a=P([1,2,3]),ps=[pt("What does the scale read when the elevator moves upward at constant speed?",nums(m*g,[m*(g+a),m*(g-a),m],' N'),1,"EL","Constant velocity: N = mg."),pt(`What does it read while the elevator accelerates UPWARD at ${a} m/s²?`,nums(m*(g+a),[m*g,m*(g-a),m*a],' N'),2,"EL",`N = m(g + a) = ${m*(g+a)} N.`),pt(`What does it read while the elevator accelerates DOWNWARD at ${a} m/s²?`,nums(m*(g-a),[m*g,m*(g+a),m*a],' N'),2,"EL",`N = m(g − a) = ${m*(g-a)} N.`),pt("The elevator is moving up but slowing down. The scale reading is",{c:"less than mg",w:["greater than mg","equal to mg","zero"]},2,"EL","Slowing while moving up means the acceleration points down, so N < mg.")];

const FF=ch=>{const b=sh([F4,F5,F3]);if(ch)return b.slice(0,2);if(Math.random()<.35)b[R(0,2)]=F6;return b};
const WF={SP:4,GC:4,CI:4,EL:2.5,PJ:1.5,GR:.8,IN:.2,N2:.4,FR:.4,PU:.4,FBD:.4,EQ:.4,CM:0};

function FM(n,h,o){const nc=Math.round(n*.4),C=pool.filter(p=>p.c&&p.s!=="CM"),M=pool.filter(p=>!p.c&&p.s!=="CM"),r=[],seen=new Set;
 for(let i=0;i<nc&&C.length;i++)r.push(C.splice(pk(C),1)[0].f(h,o));
 for(let g=0;r.length<n&&g<300;g++){const q=M[pk(M)].f(h,o);if(!seen.has(q.q)){seen.add(q.q);r.push(q)}}
 return sh(r)}
LV.easy.d="10 MCQ + 3 FRQ, one question at a time. Two tries per question with hints, instant grading, and a summary at the end.";LV.standard.d="One question at a time. Multiple choice and free response are locked apart, with an overview screen and a score review after each section, then your overall grade.";LV.advanced.d="5-option MCQs and tougher FRQs. Correct answers appear only after you move on to free response.";LV.challenging.d="5 MCQ with 6 options and 2 self-graded FRQs. No answers until the very end.";
const comBox=()=>`<b>Center of mass: ${COM?"unlocked":"locked"}</b><p class="mu">Not on your upcoming test, so center-of-mass lessons and problems stay hidden from lessons and exams until you unlock them.</p><button class="s" onclick="tgl()">${COM?"Lock center of mass again":"Unlock center of mass"}</button>`;
function build(l,md){md=md||"classic";V="exam";TI={};CR={};const hard=l==="advanced"||l==="challenging",ch=l==="challenging",n=ch?5:10,o=ch?6:l==="advanced"?5:4,fs=md==="focus"?FF(ch):ch?sh([F1,F2,F3]).slice(0,2):[F1,F2,F3];
 S={md,lvl:l,hard,free:ch,tw:l==="easy",cr:CR,ph:l==="easy"?"all":"m",i:0,ov:0,a:{},t:{},sp:{},mcq:md==="focus"?FM(n,hard,o):sh(pool.filter(p=>!p.x&&(COM||p.s!=="CM"))).slice(0,n).map(p=>p.f(hard,o)),frq:fs.map(f=>{const q=f(hard);q.ps.forEach(p=>p.o=sh([p.c,...sh(p.w).slice(0,3)]));return q})};render()}
const $=id=>document.getElementById(id),app=$("app");
function render(keep){if(!keep)window.scrollTo(0,0);app.innerHTML=nav()+(V==="home"?home():V==="lessons"?lessons():V==="lesson"?lesson():S.ph==="grade"?grade():S.ph==="result"?result():S.ph==="mrev"?mrev():S.ph==="frev"?frev():quiz())+(CF?cfm():"");sv()}
const ab=(i,L)=>String.fromCharCode(65+i);
const ITM=()=>{const m=S.mcq.map((q,i)=>({k:"m"+i,t:"m",q,l:""+(i+1)})),f=S.frq.map((fq,i)=>({k:"f"+i,t:"f",f:fq,fi:i,l:""+(i+1)}));return S.ph==="all"?[...m,...f]:S.ph==="m"?m:f};
const dn=x=>{const ks=x.t==="f"?x.f.ps.map((p,j)=>`f${x.fi}_${j}`):[x.k];return ks.every(k=>S.tw?!!(TI[k]&&TI[k].done):S.free&&x.t==="f"?!!(S.t[k]||"").trim():S.a[k]!==undefined)};
const opt=(k,j,o)=>`<label class="opt"><input type="radio" name="${k}" ${S.a[k]===j?"checked":""} onchange="S.a['${k}']=${j}"><span><b>${ab(j)}.</b> ${o}</span></label>`;
function go(i){S.i=i;S.ov=0;render()}
function ovw(){S.ov=1;render()}
function finE(){ask("Finish the exam and see your summary?",()=>{window.scrollTo(0,0);S.ph="result"})}
function quiz(){const it=ITM();S.i=Math.min(S.i,it.length-1);const x=it[S.i],e=S.lvl==="easy";if(S.ov)return ovv(it);
 let h=`<h1>${LV[S.lvl].n}${S.md==="focus"?" Focus":""} practice exam</h1><p class="mu">${x.t==="m"?"Section I: Multiple Choice":"Section II: Free Response"}. Use g = 10 m/s².</p><div class="card"><span class="tag">${x.t==="m"?"Question":"Free response"} ${S.i+1} of ${it.length}</span> `;
 if(x.t==="m")h+=`<p><b>${x.l}.</b> ${x.q.q}</p>`+(S.tw?tryBox(x.k,x.q):x.q.o.map((o,j)=>opt(x.k,j,o)).join(""));
 else{h+=`<b>Question ${x.fi+1}</b> <span class="tag">${x.f.t}</span><p>${x.f.st}</p>`+x.f.ps.map((p,j)=>{const k=`f${x.fi}_${j}`;return`<div style="margin:14px 0"><p><b>(${ab(j).toLowerCase()})</b> ${p.q} <span class="mu">[${p.pts} pt${p.pts>1?"s":""}]</span></p>`+(S.free?`<textarea oninput="S.t['${k}']=this.value" placeholder="Show your work and reasoning…">${(S.t[k]||"").replace(/</g,"&lt;")}</textarea>`:S.tw?tryBox(k,{o:p.o,a:p.o.indexOf(p.c),s:p.s,e:p.e}):p.o.map((o,jj)=>opt(k,jj,o)).join(""))+`</div>`}).join("")}
 h+=`</div>`+(S.i>0?`<button class="s" onclick="go(${S.i-1})">← Back</button>`:"")+(S.i<it.length-1?`<button onclick="go(${S.i+1})">Next →</button>`:e?`<button onclick="finE()">Finish exam</button>`:`<button onclick="ovw()">Review & continue →</button>`)+(e?"":`<button class="s" onclick="ovw()">Overview</button>`);

function ovv(it){const un=it.filter(x=>!dn(x)).length,m=S.ph==="m";
 return `<h1>${LV[S.lvl].n}${S.md==="focus"?" Focus":""} practice exam</h1><p class="mu">${m?"Section I: Multiple Choice":"Section II: Free Response"} overview. Click a box to go back to that problem.</p><div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px">${it.map((x,i)=>{const d=dn(x);return`<button class="${d?"":"s"}" style="margin:0;padding:10px 4px;${d?"background:var(--ok)":""}" onclick="go(${i})">${x.l}<br><small>${d?"✓ done":"not done"}</small></button>`}).join("")}</div><p class="mu">${it.length-un} of ${it.length} completed.</p></div><button onclick="moveOn()">${m?"Move on to free response":"Submit exam"}</button>`}
function moveOn(){const m=S.ph==="m",un=ITM().filter(x=>!dn(x)).length,w=un?` You have ${un} unfinished problem${un>1?"s":""}.`:"";
 ask(m?`Are you sure you want to move on to free response? You won’t be able to return to multiple choice.${w}`:`Are you sure you want to submit the exam?${w}`,()=>{window.scrollTo(0,0);S.i=0;S.ov=0;if(m)S.ph=S.lvl==="challenging"?"f":"mrev";else S.ph=S.free?"grade":S.lvl==="standard"?"frev":"result"})}
function mrev(){const adv=S.lvl==="advanced",n=S.mcq.length,c=S.mcq.filter((q,i)=>S.a["m"+i]===q.a).length;

function frev(){let e=0,t=0,h="";S.frq.forEach((f,i)=>f.ps.forEach((p,j)=>{const k=`f${i}_${j}`,ok=p.o[S.a[k]]===p.c,g=ok?p.pts:0;e+=g;t+=p.pts;h+=`<span class="${ok?"ok":"no"}" style="margin-right:12px"><b>${i+1}${ab(j).toLowerCase()}</b> ${ok?"✓":"✗"} ${g}/${p.pts}</span>`}));
 return `<h1>Free response complete</h1><div class="card"><b>Section II score: ${e} / ${t}</b> <span class="mu">(${Math.round(100*e/t)}%)</span></div><div class="card">${h}</div><button onclick="S.ph='result';render()">See my overall grade</button>`}
function grade(){let h=`<h1>Self-grade your free response</h1><p class="mu">Compare each response to the model answer, then award yourself points (be strict, like a College Board reader: correct reasoning and units earn credit, a bare answer without justification often doesn’t).</p>`;
 S.mcq.length;S.frq.forEach((f,i)=>{h+=`<div class="card"><b>Question ${i+1}</b> <span class="tag">${f.t}</span>`;f.ps.forEach((p,j)=>{const k=`f${i}_${j}`;h+=`<hr style="border:0;border-top:1px solid var(--bd)"><p><b>(${ab(j).toLowerCase()})</b> ${p.q}</p><p class="mu">Your response: ${S.t[k]?S.t[k].replace(/</g,"&lt;"):"<i>(blank)</i>"}</p><p><b>Model answer:</b> ${p.c}. ${p.e}</p>Points earned: <select onchange="S.sp['${k}']=+this.value">${Array.from({length:p.pts+1},(_,x)=>`<option>${x}</option>`).join("")}</select> / ${p.pts}`});h+=`</div>`});

const PR={};
